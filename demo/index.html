<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Enhancer — demo</title>
    <style>
      :root {
        --bg: #1a1f24;
        --fg: #e8eef2;
        --accent: #3d9b8f;
        --muted: #8a9aa4;
        --panel: #12161a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(ellipse at 20% 0%, #243038, var(--bg));
        color: var(--fg);
        padding: 2rem;
      }
      h1 { font-weight: 600; letter-spacing: -0.02em; margin: 0 0 1.25rem; }
      .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-bottom: 0.85rem; }
      button, label.file {
        background: var(--accent);
        color: #041210;
        border: 0;
        padding: 0.65rem 1.1rem;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary { background: #3a4550; color: var(--fg); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      label.file input { display: none; }
      .image-source { display: flex; flex-direction: column; align-items: stretch; gap: 0.4rem; }
      .reference-label { color: var(--muted); font-size: 0.85rem; }
      #reference {
        max-width: 220px;
        padding: 0.4rem;
        border: 1px solid #3a4550;
        border-radius: 6px;
        background: var(--panel);
        color: var(--fg);
      }
      #status { font-variant-numeric: tabular-nums; color: var(--muted); }
      .bar {
        height: 6px;
        background: #2c353c;
        border-radius: 3px;
        overflow: hidden;
        max-width: 420px;
        margin: 0.75rem 0 1.5rem;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.15s ease;
      }
      .previews {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1rem;
      }
      figure {
        margin: 0;
        background: var(--panel);
        border-radius: 8px;
        overflow: hidden;
      }
      figure img { display: block; width: 100%; height: auto; background: #0d1013; }
      figure img:not([src]) { display: none; }
      figcaption { padding: 0.5rem 0.75rem; font-size: 0.85rem; color: var(--muted); }
      code { font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <h1>Image Enhancer</h1>

    <div class="row">
      <div class="image-source">
        <label class="file">Выбрать изображение<input id="file" type="file" accept="image/*,.heic,.heif,.bmp" /></label>
        <label class="reference-label" for="reference">Выбрать из референсных</label>
        <select id="reference" disabled>
          <option value="">Загрузка списка…</option>
        </select>
      </div>
      <button id="degrade" class="secondary" disabled>Синтетически испортить</button>
      <button id="run" disabled>Улучшить</button>
      <button id="cancel" disabled>Отмена</button>
    </div>
    <div id="status">Ожидание файла…</div>
    <div class="bar"><i id="prog"></i></div>

    <div class="previews">
      <figure>
        <img id="before" alt="Вход" />
        <figcaption>Вход (исходник или после порчи)</figcaption>
      </figure>
      <figure>
        <img id="after" alt="Результат" />
        <figcaption>Результат <code id="params"></code></figcaption>
      </figure>
    </div>

    <script type="module">
      import {
        ImageEnhancer,
        degradeBlob,
        randomDegradeFactors,
        ensureDecodableImage,
        isHeicBuffer,
      } from './dist/index.js';

      const MODEL_URL = new URL('./models/enhance_params.bin', import.meta.url).href;
      const REFERENCE_MANIFEST_URL = new URL('./reference/manifest.json', import.meta.url).href;

      const enhancer = new ImageEnhancer({
        workerUrl: new URL('./dist/worker.js', import.meta.url),
        heicDecoderUrl: new URL('./dist/vendor/heic2any.js', import.meta.url),
      });

      const fileInput = document.getElementById('file');
      const referenceSelect = document.getElementById('reference');
      const runBtn = document.getElementById('run');
      const cancelBtn = document.getElementById('cancel');
      const degradeBtn = document.getElementById('degrade');
      const statusEl = document.getElementById('status');
      const prog = document.getElementById('prog');
      const before = document.getElementById('before');
      const after = document.getElementById('after');
      const paramsEl = document.getElementById('params');

      let currentBlob = null;
      let currentTask = null;
      let beforeUrl = null;

      async function checkModel() {
        try {
          const res = await fetch(MODEL_URL, { method: 'GET', cache: 'no-store' });
          return res.ok;
        } catch (_) {
          return false;
        }
      }

      const modelOk = await checkModel();

      async function loadReferences() {
        try {
          const res = await fetch(REFERENCE_MANIFEST_URL, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const references = await res.json();
          referenceSelect.replaceChildren(new Option('Выберите изображение…', ''));
          for (const name of references) {
            referenceSelect.add(new Option(name, name));
          }
          referenceSelect.disabled = references.length === 0;
          if (references.length === 0) {
            referenceSelect.replaceChildren(new Option('Референсы не найдены', ''));
          }
        } catch (_) {
          referenceSelect.replaceChildren(new Option('Референсы недоступны', ''));
          referenceSelect.disabled = true;
        }
      }

      await loadReferences();

      /** Chrome/Firefox cannot show HEIC in <img> — decode to PNG/JPEG for preview. */
      async function toDisplayableBlob(blob, nameHint = '') {
        const buf = await blob.arrayBuffer();
        const hint = blob.type || (/\.heic$/i.test(nameHint) || /\.heif$/i.test(nameHint) ? 'image/heic' : undefined);
        if (!isHeicBuffer(buf, hint) && !(hint && /heic|heif/i.test(hint))) {
          return blob;
        }
        statusEl.textContent = 'Декодирование HEIC для превью…';
        const decoded = await ensureDecodableImage(buf, hint || 'image/heic');
        return new Blob([decoded.buffer], { type: decoded.mime });
      }

      function setWorkingBlob(blob, label) {
        currentBlob = blob;
        if (beforeUrl) URL.revokeObjectURL(beforeUrl);
        beforeUrl = URL.createObjectURL(blob);
        before.src = beforeUrl;
        runBtn.disabled = false;
        degradeBtn.disabled = false;
        statusEl.textContent = label;
      }

      enhancer.on('status', (info) => {
        const pred = info.metrics?.predictor ? ` · ${info.metrics.predictor}` : '';
        statusEl.textContent =
          `${info.id} · ${info.status} · ${(info.progress * 100).toFixed(0)}%` +
          pred +
          (info.warning ? ` · Предупреждение: ${info.warning}` : '') +
          (info.error ? ` · ${info.error}` : '') +
          (info.metrics ? ` · ${info.metrics.elapsedMs.toFixed(0)} ms` : '');
        prog.style.width = `${(info.progress * 100).toFixed(1)}%`;
        if (info.metrics?.params) {
          const p = info.metrics.params;
          paramsEl.textContent = `b=${p.brightness.toFixed(2)} c=${p.contrast.toFixed(2)} s=${p.saturation.toFixed(2)}`;
        }
      });

      fileInput.addEventListener('change', async () => {
        const f = fileInput.files?.[0] ?? null;
        after.removeAttribute('src');
        referenceSelect.value = '';
        if (!f) {
          currentBlob = null;
          if (beforeUrl) URL.revokeObjectURL(beforeUrl);
          beforeUrl = null;
          before.removeAttribute('src');
          runBtn.disabled = true;
          degradeBtn.disabled = true;
          statusEl.textContent = 'Ожидание файла…';
          return;
        }
        runBtn.disabled = true;
        degradeBtn.disabled = true;
        try {
          const displayable = await toDisplayableBlob(f, f.name);
          setWorkingBlob(displayable, `Файл: ${f.name}`);
        } catch (e) {
          statusEl.textContent = `Не удалось открыть файл: ${e.message}`;
          currentBlob = null;
        }
      });

      referenceSelect.addEventListener('change', async () => {
        const name = referenceSelect.value;
        if (!name) return;
        runBtn.disabled = true;
        degradeBtn.disabled = true;
        after.removeAttribute('src');
        try {
          const url = new URL(`./reference/${encodeURIComponent(name)}`, import.meta.url);
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const blob = await res.blob();
          const displayable = await toDisplayableBlob(blob, name);
          fileInput.value = '';
          setWorkingBlob(displayable, `Референс: ${name}`);
        } catch (e) {
          statusEl.textContent = `Не удалось открыть референс: ${e.message}`;
          currentBlob = null;
        }
      });

      degradeBtn.addEventListener('click', async () => {
        if (!currentBlob) return;
        degradeBtn.disabled = true;
        try {
          // ensure raster (HEIC already converted on load)
          const factors = randomDegradeFactors({ min: 0.7, max: 1.3 });
          const { blob } = await degradeBlob(currentBlob, factors);
          setWorkingBlob(
            blob,
            `Испорчено: b=${factors.brightness.toFixed(2)} c=${factors.contrast.toFixed(2)} s=${factors.saturation.toFixed(2)}`,
          );
          after.removeAttribute('src');
        } catch (e) {
          statusEl.textContent = `Ошибка порчи: ${e.message}`;
        } finally {
          degradeBtn.disabled = !currentBlob;
        }
      });

      runBtn.addEventListener('click', async () => {
        if (!currentBlob) return;
        if (!modelOk) {
          statusEl.textContent = 'Модель не найдена: положите enhance_params.bin в models/ и выполните npm run build.';
          return;
        }
        runBtn.disabled = true;
        cancelBtn.disabled = false;
        after.removeAttribute('src');
        try {
          currentTask = await enhancer.submit(currentBlob, {
            quality: 0.92,
            modelUrl: MODEL_URL,
          });
          const blob = await enhancer.getResult(currentTask);
          after.src = URL.createObjectURL(blob);
        } catch (e) {
          statusEl.textContent = `Ошибка: ${e.message}`;
        } finally {
          runBtn.disabled = !currentBlob;
          cancelBtn.disabled = true;
          currentTask = null;
        }
      });

      cancelBtn.addEventListener('click', () => {
        if (currentTask) enhancer.cancel(currentTask);
      });
    </script>
  </body>
</html>
